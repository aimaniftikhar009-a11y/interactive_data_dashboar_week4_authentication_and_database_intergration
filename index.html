<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Secure Dashboard</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="auth-body">
<div class="card">
  <div class="badge">Week 4 - Production Ready</div>
  <h2>Welcome Back</h2><p class="sub">Please sign in to continue</p>
  <input id="email" type="email" placeholder="Email Address">
  <input id="password" type="password" placeholder="Password (min 4 chars)">
  <button id="loginBtn" class="btn-black">Secure Sign In</button>
  <button id="signupBtn" class="btn-light">Create Account</button>
  <div id="toast"></div>
</div>
<script src="app.js"></script>
</body>
</html>
